name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'apps/server[test]'
      - run: python -m pytest apps/server/tests
      - run: python scripts/export_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run generate:contracts
      - run: git diff --exit-code -- docs/openapi.json apps/desktop/src/types/api.generated.ts
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run check
      - run: npm --prefix apps/desktop test -- --run
      - run: npm --prefix apps/desktop run build
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: npm --prefix apps/desktop run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-demo-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
